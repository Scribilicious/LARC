; LARC addition: blood stains spawned on walls/floor when a shot hits an entity
; sizes are half-extents in tile units (walls) / world units (floor)
; Blur: 0 = hard edged drops piling up in flat steps, 1 = soft round spray
[BLOODSTAIN]
MaxStains=48
WallHalfWidth=0.16
WallHalfHeight=0.15
FloorHalfSize=0.25
Blur=0

; LARC addition: short blood spray on entity hits (shader-driven particles)
; Lifetime is in seconds (the spray is flung out and gone before it can fall),
; WorldRadius is the droplet size in world units and Size scales the whole
; burst (droplets and spread together; 1.0 = default)
; Blur: 0 = hard pixel edges and stippled haze, 1 = smooth soft spray
[BLOODBURST]
MaxBursts=20
Lifetime=0.5
WorldRadius=0.1
Size=1.0
Blur=0

; LARC addition: HUD blood splats when the player is hit (replaces the
; GFX/Effects/Bloodstains.png overlay of the C++ build) and the red
; low-health tint. These are the only knobs for the effect - it has no
; pause menu entries.
; FadeTime is in seconds, Hold is the fraction of it a splat keeps full
; strength before it starts fading, Splats is the number thrown per 10 damage,
; Radius is the splat half-extent as a fraction of the viewport height.
; Blur: 0 = hard pixel droplets, 1 = soft spray.
; Slide is how far (in splat radii) the fastest drop runs down the
; screen over one FadeTime; 0 keeps the splash frozen.
; LowHealthThreshold is the health fraction below which the red tint ramps in
; (0.1 = 10%), LowHealthStrength its maximum alpha, LowHealthPulse the
; heartbeat throb.
[BLOODHUD]
Enabled=1
FadeTime=8
Hold=0.35
Splats=2
Radius=0.22
Blur=0
Slide=1.6
MaxSplats=24
LowHealthEnabled=1
LowHealthThreshold=0.1
LowHealthStrength=0.55
LowHealthPulse=1
