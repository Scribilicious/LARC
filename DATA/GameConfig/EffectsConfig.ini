[EFFECTS]
; BloodstainDuration is given in frames
BloodstainDuration=15

[TEXTURES]
Bloodstains=./GFX/Effects/Bloodstains.png

; LARC addition: blood stains spawned on walls/floor when a shot hits an entity
; sizes are half-extents in tile units (walls) / world units (floor)
; Blur: 0 = hard edged drops piling up in flat steps, 1 = soft round spray
[BLOODSTAIN]
MaxStains=48
WallHalfWidth=0.16
WallHalfHeight=0.15
FloorHalfSize=0.25
Blur=0

; LARC addition: short blood spray on entity hits (shader-driven particles)
; Lifetime is in seconds (the spray is flung out and gone before it can fall),
; WorldRadius is the droplet size in world units and Size scales the whole
; burst (droplets and spread together; 1.0 = default)
; Blur: 0 = hard pixel edges and stippled haze, 1 = smooth soft spray
[BLOODBURST]
MaxBursts=20
Lifetime=0.5
WorldRadius=0.1
Size=1.0
Blur=0
